name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:v4.14.11
        ports: ["16379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo test --features local-embeddings
      - run: cargo test --test store --test mcp -- --ignored
      - run: python3 scripts/download-minilm.py
      - run: LOCAL_TEST_MODEL_DIR=models/minilm cargo test --features local-embeddings --test models -- --include-ignored
  arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: cargo build --release --locked --features local-embeddings
