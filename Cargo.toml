[package]
name = "graphiti-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Lightweight temporal graph memory and MCP server for Raspberry Pi"
license = "Apache-2.0"
repository = "https://github.com/andyjusa/graphiti-rs"

[features]
default = []
graphiti-compat = ["dep:rusqlite", "dep:blake2"]
local-embeddings = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.5", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["onig"], optional = true }

blake2 = { version = "0.10.6", optional = true }
rusqlite = { version = "0.37", features = ["bundled"], optional = true }

[dev-dependencies]
rmcp = { version = "3.5", features = ["client"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
